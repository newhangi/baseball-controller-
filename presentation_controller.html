<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>直播控制器 (支援自訂資訊)</title>
  <!-- 免費雲端 MQTT 通訊庫 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #121c2d;
      --card-active: #1e3355;
      --primary: #4df3ff;
      --accent: #ffde59;
      --danger: #ff4d4d;
      --border: #2a3d66;
      --text-muted: #8fa0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      padding: 14px;
      padding-bottom: 90px;
    }

    /* 頂部狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      margin-right: 6px;
    }
    .status-indicator.online { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

    /* 分頁標籤切換 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* 快捷功能列 */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .action-btn {
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .action-btn:active { opacity: 0.7; }
    .action-btn.active-warn { background: #664400; border-color: var(--accent); color: var(--accent); }

    /* 表單區塊 */
    .custom-box {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #060a12;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }

    .form-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-submit {
      flex: 1.2;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-save {
      flex: 1;
      background: #1e3355;
      color: #fff;
      border: 1px solid var(--primary);
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 名單卡片列表 */
    .speaker-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .speaker-card {
      position: relative;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      transition: all 0.2s ease;
    }

    .speaker-card.active {
      border-color: var(--accent);
      background: var(--card-active);
      box-shadow: 0 0 10px rgba(255, 222, 89, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .speaker-name {
      font-size: 19px;
      font-weight: bold;
      color: #ffffff;
    }
    .speaker-card.active .speaker-name {
      color: var(--accent);
    }

    .speaker-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .speaker-slogan {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
    }

    /* 底部固定狀態條 */
    .current-display {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 14, 23, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .current-name {
      color: var(--accent);
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- 連線狀態 -->
  <div class="status-bar">
    <div>
      <span class="status-indicator" id="statusDot"></span>
      <span id="statusText">MQTT 連線中...</span>
    </div>
    <div style="color: var(--text-muted);">頻道: <span style="color: var(--primary);">2026-LIVE</span></div>
  </div>

  <!-- 快捷功能列 -->
  <div class="quick-actions">
    <button class="action-btn" id="nextBtn" onclick="toggleNextOverlay()">
      ⏭ 轉場下一位
    </button>
    <button class="action-btn" onclick="resendCurrent()">
      🔄 重整發送當前
    </button>
  </div>

  <!-- 分頁選單 -->
  <div class="tabs">
    <button class="tab-btn active" id="tabListBtn" onclick="switchTab('list')">候選人名單切換</button>
    <button class="tab-btn" id="tabCustomBtn" onclick="switchTab('custom')">自訂資訊即時推送</button>
  </div>

  <!-- 分頁 1: 自訂資訊即時輸入 -->
  <div id="viewCustom" style="display: none;">
    <div class="custom-box">
      <div class="form-group">
        <label>校長姓名</label>
        <input type="text" id="inputName" placeholder="例如：林書銘">
      </div>
      <div class="form-group">
        <label>期別 / 身分標牌</label>
        <input type="text" id="inputTerm" placeholder="例如：第28期候用校長">
      </div>
      <div class="form-group">
        <label>底部側標 / 辦學理念標語</label>
        <textarea id="inputSlogan" rows="2" placeholder="例如：以愛為核心、共創智慧新校園"></textarea>
      </div>

      <div class="form-btns">
        <button class="btn-submit" onclick="sendCustomData()">⚡ 立即更新 OBS 畫面</button>
        <button class="btn-save" onclick="saveToCards()">💾 存入名單卡片</button>
      </div>
    </div>
  </div>

  <!-- 分頁 2: 快速點選名單 -->
  <div id="viewList">
    <div class="speaker-list" id="cardContainer"></div>
  </div>

  <!-- 底部即時顯示列 -->
  <div class="current-display">
    <div>當前 OBS 顯示：<span class="current-name" id="currentLabel">尚未發送</span></div>
    <button onclick="clearDisplay()" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: #1a263d; color: #cbd5e1; font-size: 12px;">清空</button>
  </div>

  <script>
    // 預設名單
    const DEFAULT_SPEAKERS = [
      { name: "陳秋貝", term: "第28期候用校長", slogan: "以溫度引領、以專業實踐，成就師生與學校共好願景" },
      { name: "王大同", term: "第28期候用校長", slogan: "科技賦能創新，厚植學生跨域核心素養" },
      { name: "李小美", term: "第28期候用校長", slogan: "適性揚才無極限，讓每位孩子找到發光的舞台" },
      { name: "張文華", term: "第28期候用校長", slogan: "友善溫馨活力校園，深化品格共創卓越未來" },
      { name: "趙志強", term: "第28期候用校長", slogan: "深化雙語跨國鏈結，拓展新世代世界競爭力" },
      { name: "林玉玲", term: "第28期候用校長", slogan: "深耕閱讀與多元美感，培育終身自主學習力" }
    ];

    // 本地持久化資料讀取
    let speakers = JSON.parse(localStorage.getItem('stream_speakers')) || DEFAULT_SPEAKERS;

    // 通訊主題設定（需與 presentation_overlay.html 保持一致）
    const TOPIC = "taoyuan-live-controller-x883";
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    let currentSpeaker = null;
    let isNextMode = false;

    // MQTT 連線事件
    client.on('connect', () => {
      document.getElementById('statusDot').classList.add('online');
      const text = document.getElementById('statusText');
      text.innerText = "已連線 (可隨時點按操作)";
      text.style.color = "#00ff88";
    });

    client.on('offline', () => {
      document.getElementById('statusDot').classList.remove('online');
      const text = document.getElementById('statusText');
      text.innerText = "離線中，重新連線...";
      text.style.color = "#ff4d4d";
    });

    // 渲染名單卡片
    function renderCards() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = "";

      speakers.forEach((item, index) => {
        const card = document.createElement('div');
        const isActive = currentSpeaker && currentSpeaker.name === item.name;
        card.className = `speaker-card ${isActive ? 'active' : ''}`;
        card.id = `card-${index}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="speaker-name">${index + 1}. ${item.name}</span>
            <span class="speaker-tag">${item.term}</span>
          </div>
          <div class="speaker-slogan">${item.slogan}</div>
          <div class="card-actions">
            <button class="btn-icon" onclick="editCard(event, ${index})">✏️ 載入編輯</button>
            <button class="btn-icon" style="color:var(--danger);" onclick="deleteCard(event, ${index})">🗑️ 刪除</button>
          </div>
        `;

        // 點擊卡片直接更換 OBS
        card.onclick = (e) => {
          if (e.target.tagName.toLowerCase() === 'button') return;
          pushToOBS(item);
        };

        container.appendChild(card);
      });

      // 同步儲存至手機 localStorage
      localStorage.setItem('stream_speakers', JSON.stringify(speakers));
    }

    // 發送資料給 OBS
    function pushToOBS(data) {
      currentSpeaker = data;
      document.getElementById('currentLabel').innerText = data.name;

      if (navigator.vibrate) navigator.vibrate(40);

      // 發布 MQTT 廣播
      client.publish(TOPIC, JSON.stringify({
        action: "switchSpeaker",
        name: data.name,
        term: data.term,
        slogan: data.slogan
      }));

      renderCards();
    }

    // 自訂輸入並立即送出
    function sendCustomData() {
      const name = document.getElementById('inputName').value.trim();
      const term = document.getElementById('inputTerm').value.trim() || "候用校長";
      const slogan = document.getElementById('inputSlogan').value.trim() || "";

      if (!name) {
        alert("請至少輸入校長姓名！");
        return;
      }

      pushToOBS({ name, term, slogan });
    }

    // 存入名單卡片
    function saveToCards() {
      const name = document.getElementById('inputName').value.trim();
      const term = document.getElementById('inputTerm').value.trim() || "候用校長";
      const slogan = document.getElementById('inputSlogan').value.trim() || "";

      if (!name) {
        alert("請輸入校長姓名再儲存！");
        return;
      }

      speakers.push({ name, term, slogan });
      renderCards();
      switchTab('list');
      alert(`已成功將「${name}」加入名單！`);
    }

    // 載入至編輯框
    function editCard(e, index) {
      e.stopPropagation();
      const item = speakers[index];
      document.getElementById('inputName').value = item.name;
      document.getElementById('inputTerm').value = item.term;
      document.getElementById('inputSlogan').value = item.slogan;
      switchTab('custom');
    }

    // 刪除卡片
    function deleteCard(e, index) {
      e.stopPropagation();
      if (confirm(`確定要刪除「${speakers[index].name}」嗎？`)) {
        speakers.splice(index, 1);
        renderCards();
      }
    }

    // 重發當前
    function resendCurrent() {
      if (currentSpeaker) pushToOBS(currentSpeaker);
    }

    // 清空 OBS 顯示
    function clearDisplay() {
      client.publish(TOPIC, JSON.stringify({
        action: "switchSpeaker",
        name: "",
        term: "",
        slogan: ""
      }));
      document.getElementById('currentLabel').innerText = "(已清空)";
      currentSpeaker = null;
      renderCards();
    }

    // NEXT 轉場按鈕
    function toggleNextOverlay() {
      isNextMode = !isNextMode;
      const btn = document.getElementById('nextBtn');
      btn.classList.toggle('active-warn', isNextMode);

      client.publish(TOPIC, JSON.stringify({
        action: "toggleNext",
        show: isNextMode
      }));
    }

    // 分頁切換
    function switchTab(tab) {
      const isList = tab === 'list';
      document.getElementById('viewList').style.display = isList ? 'block' : 'none';
      document.getElementById('viewCustom').style.display = isList ? 'none' : 'block';
      document.getElementById('tabListBtn').classList.toggle('active', isList);
      document.getElementById('tabCustomBtn').classList.toggle('active', !isList);
    }

    // 初始化
    renderCards();
  </script>
</body>
</html>
