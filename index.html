<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>OBS 棒球直播全功能轉播面板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: transparent;
      color: #fff;
      position: relative;
    }

    /* 1. 左上角：CPBL 總表 + 球員照 */
    .top-left-widget {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: stretch;
      gap: 16px;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.75));
    }

    .cpbl-scorebug {
      width: 350px;
      background: #172033;
      border: 2px solid #2e3e5c;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-meta-bar {
      background: #1e293b;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #2e3e5c;
    }

    .pitcher-bar {
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      border-bottom: 1px solid #1f2937;
    }
    .pitcher-tag {
      background: #eab308;
      color: #000;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 2px;
      margin-right: 6px;
      font-weight: 900;
    }

    .score-main-bar {
      display: flex;
      height: 48px;
      align-items: center;
      background: #000;
    }
    .team-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 10px;
      font-size: 17px;
      font-weight: 900;
    }
    .team-away-block {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      color: #fff;
      border-right: 1px solid #111;
    }
    .team-home-block {
      background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
      color: #000;
    }
    .team-score {
      font-size: 24px;
      min-width: 22px;
      text-align: center;
    }

    .bases-container {
      width: 70px;
      height: 100%;
      background: #1e293b;
      position: relative;
    }
    .base-diamond {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #475569;
      transform: rotate(45deg);
      border: 1px solid #0f172a;
      transition: background 0.15s ease;
    }
    .base-diamond.active {
      background: #facc15;
      box-shadow: 0 0 6px rgba(250, 204, 21, 0.8);
    }
    .base-2nd { top: 6px; left: 29px; }
    .base-3rd { top: 18px; left: 16px; }
    .base-1st { top: 18px; left: 42px; }

    .count-bar {
      background: #111c2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 800;
      border-bottom: 1px solid #1e293b;
    }
    .inning-box { color: #38bdf8; display: flex; align-items: center; gap: 4px; }
    .bso-group { display: flex; align-items: center; gap: 8px; }
    .bso-item { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; }
    .dot.ball { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .dot.strike { background: #eab308; box-shadow: 0 0 5px #eab308; }
    .dot.out { background: #ef4444; box-shadow: 0 0 5px #ef4444; }

    .batter-bar {
      background: #0b1120;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      border-left: 4px solid #ef4444;
      transition: border-color 0.2s;
    }

    /* 右側球員半身照卡片（白外框） */
    .player-photo-card {
      width: 140px;
      height: 165px;
      background: #172033;
      border: 3px solid #ffffff;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      position: relative;
    }
    .player-photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: opacity 0.15s ease;
    }
    .player-photo-placeholder {
      display: none;
      font-size: 13px;
      color: #94a3b8;
      font-weight: bold;
      text-align: center;
    }

    /* 2. 右上角：1~9 局詳細計分板 */
    .top-right-table {
      position: absolute;
      top: 30px;
      right: 40px;
      border-collapse: collapse;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
    }
    .top-right-table th, .top-right-table td {
      width: 34px;
      height: 32px;
      border: 1px solid #334155;
      font-size: 14px;
    }
    .top-right-table th { background: #1e293b; color: #94a3b8; }
    .top-right-table .team-cell { width: 70px; color: #fff; font-size: 15px; }
    .team-away-bg { background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%); color: #fff; }
    .team-home-bg { background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); color: #000; }
    .stat-header { background: #c2410c !important; color: #fff !important; }

    /* 3. 右下角：雙隊打線名單 */
    .bottom-right-lineup {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 16px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
    }
    .lineup-box {
      width: 175px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .lineup-header { padding: 6px; text-align: center; font-weight: 900; font-size: 14px; }
    .lineup-list { list-style: none; }
    .lineup-item {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      font-size: 13px;
      border-bottom: 1px solid #1e293b;
    }
    .lineup-item .order { width: 18px; font-weight: bold; color: #64748b; }
    .lineup-item .player-name { flex: 1; font-weight: 700; text-align: center; }
    .lineup-item .position { width: 25px; color: #94a3b8; font-size: 11px; text-align: right; }
    .lineup-item.active { background-color: #f59e0b; color: #000; font-weight: bold; }
    .lineup-item.active .order, .lineup-item.active .position { color: #000; }

    /* 4. 左下角：橫向控制操作列 */
    .bottom-left-controller {
      position: absolute;
      bottom: 235px;
      left: 30px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    .ctrl-btn {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 900;
      border-radius: 6px;
      border: none;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter 0.1s, transform 0.1s;
      white-space: nowrap;
    }
    .ctrl-btn:active { filter: brightness(0.8); transform: scale(0.96); }

    .btn-ball { background: #166534; border: 1px solid #22c55e; }
    .btn-strike { background: #854d0e; border: 1px solid #eab308; }
    .btn-out { background: #991b1b; border: 1px solid #ef4444; }
    .btn-slate { background: #334155; }
    .btn-blue { background: #2563eb; }
    .btn-orange { background: #ea580c; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 1. 左上角總表與球員照片 -->
  <div class="top-left-widget">
    <div class="cpbl-scorebug">
      <div class="top-meta-bar">
        <span>2026 到齊全系列 GAME 4</span>
        <span id="game-status-sub">對外賽</span>
      </div>
      <div class="pitcher-bar">
        <div><span class="pitcher-tag">P</span><span id="pitcher-name">投手</span></div>
        <div><span style="color:#94a3b8; font-size: 11px;">NP:</span> <span id="pitcher-count">0</span></div>
      </div>
      <div class="score-main-bar">
        <div class="team-block team-away-block">
          <span id="name-away">到齊</span>
          <span class="team-score" id="score-away">0</span>
        </div>
        <div class="team-block team-home-block">
          <span id="name-home">友隊</span>
          <span class="team-score" id="score-home">0</span>
        </div>
        <div class="bases-container">
          <div class="base-diamond base-2nd" id="base2"></div>
          <div class="base-diamond base-3rd" id="base3"></div>
          <div class="base-diamond base-1st" id="base1"></div>
        </div>
      </div>
      <div class="count-bar">
        <div class="inning-box"><span id="disp-inning">1</span><span id="disp-arrow">▲</span></div>
        <div class="bso-group">
          <div class="bso-item">B <div class="dot" id="b1"></div><div class="dot" id="b2"></div><div class="dot" id="b3"></div></div>
          <div class="bso-item">S <div class="dot" id="s1"></div><div class="dot" id="s2"></div></div>
          <div class="bso-item">O <div class="dot" id="o1"></div><div class="dot" id="o2"></div></div>
        </div>
      </div>
      <div class="batter-bar" id="batter-container">
        <div>
          <span id="disp-batter-order" style="color: #94a3b8; margin-right: 6px;">1</span>
          <span id="disp-batter-name">James</span>
        </div>
        <div id="disp-batter-stat" style="color: #cbd5e1; font-size: 12px;">0-0</div>
      </div>
    </div>

    <!-- 球員定裝半身照 -->
    <div class="player-photo-card" id="photo-card">
      <img id="player-img" src="" alt="球員照" onerror="handleImgError()" onload="handleImgLoad()" />
      <div class="player-photo-placeholder" id="photo-placeholder">球員照片<br>建置中</div>
    </div>
  </div>

  <!-- 2. 右上角詳細計分板 -->
  <table class="top-right-table">
    <thead>
      <tr>
        <th>TEAM</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
        <th class="stat-header">R</th><th class="stat-header">H</th><th class="stat-header">E</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="team-cell team-away-bg">到齊</td>
        <td id="away-1"></td><td id="away-2"></td><td id="away-3"></td><td id="away-4"></td><td id="away-5"></td><td id="away-6"></td><td id="away-7"></td><td id="away-8"></td><td id="away-9"></td>
        <td id="away-r">0</td><td id="away-h">0</td><td id="away-e">0</td>
      </tr>
      <tr>
        <td class="team-cell team-home-bg">友隊</td>
        <td id="home-1"></td><td id="home-2"></td><td id="home-3"></td><td id="home-4"></td><td id="home-5"></td><td id="home-6"></td><td id="home-7"></td><td id="home-8"></td><td id="home-9"></td>
        <td id="home-r">0</td><td id="home-h">0</td><td id="home-e">0</td>
      </tr>
    </tbody>
  </table>

  <!-- 3. 右下角打線名單 -->
  <div class="bottom-right-lineup">
    <div class="lineup-box">
      <div class="lineup-header team-away-bg">到齊 打線</div>
      <ul class="lineup-list" id="lineup-away"></ul>
    </div>
    <div class="lineup-box">
      <div class="lineup-header team-home-bg">友隊 打線</div>
      <ul class="lineup-list" id="lineup-home"></ul>
    </div>
  </div>

  <!-- 4. 左下角橫向控制條 -->
  <div class="bottom-left-controller">
    <button class="ctrl-btn btn-ball" onclick="addBall()">壞球 (B+1)</button>
    <button class="ctrl-btn btn-strike" onclick="addStrike()">好球 (S+1)</button>
    <button class="ctrl-btn btn-out" onclick="addOut()">出局 (O+1)</button>
    <button class="ctrl-btn btn-slate" onclick="clearBS()">清空球數</button>
    <button class="ctrl-btn btn-slate" onclick="toggleBase(1)">一壘</button>
    <button class="ctrl-btn btn-slate" onclick="toggleBase(2)">二壘</button>
    <button class="ctrl-btn btn-slate" onclick="toggleBase(3)">三壘</button>
    <button class="ctrl-btn btn-slate" onclick="clearBases()">清空壘包</button>
    <button class="ctrl-btn btn-blue" onclick="nextBatter()">下一棒</button>
    <button class="ctrl-btn btn-orange" onclick="switchHalfInning()">換半局</button>
    <button class="ctrl-btn" style="background: #475569; border: 1px solid #94a3b8;" onclick="resetEntireGame()">全新比賽 (全部重設)</button>
  </div>

<script>
  let awayPlayers = [
    { name: "James", pos: "2B", img: "players/James.png" },
    { name: "Bryan", pos: "CF", img: "players/Bryan.jpg" },
    { name: "Justin", pos: "SS", img: "players/away3.png" },
    { name: "第四棒", pos: "3B", img: "players/away4.png" },
    { name: "第五棒", pos: "1B", img: "players/away5.png" },
    { name: "第六棒", pos: "LF", img: "players/away6.png" },
    { name: "第七棒", pos: "DH", img: "players/away7.png" },
    { name: "第八棒", pos: "C",  img: "players/away8.png" },
    { name: "第九棒", pos: "RF", img: "players/away9.png" }
  ];

  let homePlayers = [
    { name: "第一棒", pos: "3B", img: "players/home1.png" },
    { name: "第二棒", pos: "2B", img: "players/home2.png" },
    { name: "第三棒", pos: "RF", img: "players/home3.png" },
    { name: "第四棒", pos: "DH", img: "players/home4.png" },
    { name: "第五棒", pos: "CF", img: "players/home5.png" },
    { name: "第六棒", pos: "LF", img: "players/home6.png" },
    { name: "第七棒", pos: "SS", img: "players/home7.png" },
    { name: "第八棒", pos: "C",  img: "players/home8.png" },
    { name: "第九棒", pos: "1B", img: "players/home9.png" }
  ];

  let localState = {
    currentInning: 1,
    isBottom: false,
    balls: 0,
    strikes: 0,
    outs: 0,
    batterAway: 0,
    batterHome: 0,
    bases: { 1: false, 2: false, 3: false },
    scores: { away: {}, home: {} },
    stats: { away: { h: 0, e: 0 }, home: { h: 0, e: 0 } },
    playerStats: { away: {}, home: {} }
  };

  function initLineup(elemId, list) {
    const ul = document.getElementById(elemId);
    ul.innerHTML = "";
    list.forEach((p, i) => {
      ul.innerHTML += `<li class="lineup-item" id="${elemId}-${i}">
        <span class="order">${i+1}</span>
        <span class="player-name">${p.name}</span>
        <span class="position">${p.pos}</span>
      </li>`;
    });
  }
  initLineup("lineup-away", awayPlayers);
  initLineup("lineup-home", homePlayers);

  function handleImgError() {
    const imgElem = document.getElementById("player-img");
    if (imgElem.src.endsWith(".png")) {
      imgElem.src = imgElem.src.replace(".png", ".jpg");
    } else {
      imgElem.style.display = "none";
      document.getElementById("photo-placeholder").style.display = "block";
    }
  }
  function handleImgLoad() {
    document.getElementById("player-img").style.display = "block";
    document.getElementById("photo-placeholder").style.display = "none";
  }

  function renderUI(data) {
    if (!data) return;

    // 1. 局數與箭頭
    document.getElementById("disp-inning").innerText = data.currentInning || 1;
    document.getElementById("disp-arrow").innerText = data.isBottom ? "▼" : "▲";

    // 2. BSO 燈號
    const b = data.balls || 0, s = data.strikes || 0, o = data.outs || 0;
    document.getElementById("b1").classList.toggle("ball", b >= 1);
    document.getElementById("b2").classList.toggle("ball", b >= 2);
    document.getElementById("b3").classList.toggle("ball", b >= 3);
    document.getElementById("s1").classList.toggle("strike", s >= 1);
    document.getElementById("s2").classList.toggle("strike", s >= 2);
    document.getElementById("o1").classList.toggle("out", o >= 1);
    document.getElementById("o2").classList.toggle("out", o >= 2);

    // 3. 壘包
    document.getElementById("base1").classList.toggle("active", !!(data.bases && data.bases[1]));
    document.getElementById("base2").classList.toggle("active", !!(data.bases && data.bases[2]));
    document.getElementById("base3").classList.toggle("active", !!(data.bases && data.bases[3]));

    // 4. 打者資訊、即時成績與照片
    const isAway = !data.isBottom;
    const curIdx = isAway ? (data.batterAway || 0) : (data.batterHome || 0);
    const curTeamKey = isAway ? 'away' : 'home';
    const curTeamList = isAway ? awayPlayers : homePlayers;
    const player = curTeamList[curIdx] || { name: "打者", img: "" };

    document.querySelectorAll('.lineup-item').forEach(el => el.classList.remove('active'));
    const targetItem = document.getElementById(`${isAway ? 'lineup-away' : 'lineup-home'}-${curIdx}`);
    if (targetItem) targetItem.classList.add('active');

    document.getElementById("disp-batter-order").innerText = curIdx + 1;
    document.getElementById("disp-batter-name").innerText = player.name;
    document.getElementById("batter-container").style.borderLeftColor = isAway ? "#ef4444" : "#eab308";

    // 動態更新打者個人成績 (安打數 - 打數)
    const pStats = (data.playerStats && data.playerStats[curTeamKey] && data.playerStats[curTeamKey][curIdx]) || { h: 0, ab: 0 };
    document.getElementById("disp-batter-stat").innerText = `${pStats.h || 0}-${pStats.ab || 0}`;

    const imgElem = document.getElementById("player-img");
    if (player.img) {
      imgElem.src = player.img;
    } else {
      imgElem.style.display = "none";
      document.getElementById("photo-placeholder").style.display = "block";
    }

    // 5. 比分與 R / H / E 統計同步
    ['away', 'home'].forEach(t => {
      let total = 0;
      let hasScores = false;
      for (let i = 1; i <= 9; i++) {
        const val = data.scores && data.scores[t] && data.scores[t][i];
        const cell = document.getElementById(`${t}-${i}`);
        if (val !== undefined && val !== null && val !== "") {
          cell.innerText = val;
          total += parseInt(val, 10);
          hasScores = true;
        } else {
          cell.innerText = "";
        }
      }
      document.getElementById(`${t}-r`).innerText = hasScores ? total : "0";
      document.getElementById(`score-${t}`).innerText = hasScores ? total : "0";

      const hCount = (data.stats && data.stats[t] && data.stats[t].h) || 0;
      const eCount = (data.stats && data.stats[t] && data.stats[t].e) || 0;
      document.getElementById(`${t}-h`).innerText = hCount;
      document.getElementById(`${t}-e`).innerText = eCount;
    });
  }

  renderUI(localState);

  let db = null;
  let stateRef = null;
  let lineupRef = null;

  try {
    const firebaseConfig = {
      databaseURL: "https://baseball-board-live-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const currentRoom = urlParams.get('room') || 'default';

    stateRef = db.ref('games/' + currentRoom + '/gameState');
    lineupRef = db.ref('games/' + currentRoom + '/lineups');

    stateRef.on('value', (snap) => {
      const data = snap.val();
      if (data) {
        localState = data;
        renderUI(localState);
      }
    });

    lineupRef.on('value', (snap) => {
      const data = snap.val();
      if (data) {
        if (data.away && data.away.length) {
          awayPlayers = data.away.map(p => ({
            name: p.name,
            pos: p.pos,
            img: `players/${p.name}.png`
          }));
          initLineup("lineup-away", awayPlayers);
        }
        if (data.home && data.home.length) {
          homePlayers = data.home.map(p => ({
            name: p.name,
            pos: p.pos,
            img: `players/${p.name}.png`
          }));
          initLineup("lineup-home", homePlayers);
        }
        renderUI(localState);
      }
    });
  } catch (err) {
    console.log("Firebase 尚未配置或離線運作中，啟用本機控制模式。");
  }

  function updateState(modifierFn) {
    localState = modifierFn(localState);
    renderUI(localState);
    if (stateRef) {
      stateRef.set(localState);
    }
  }

  function addBall() {
    updateState(s => {
      s.balls = (s.balls || 0) + 1;
      if (s.balls >= 4) {
        s.balls = 0; s.strikes = 0;
        if (!s.bases) s.bases = {};
        s.bases[1] = true;
      }
      return s;
    });
  }

  function addStrike() {
    updateState(s => {
      s.strikes = (s.strikes || 0) + 1;
      if (s.strikes >= 3) {
        s.balls = 0; s.strikes = 0;
        s.outs = (s.outs || 0) + 1;
      }
      return s;
    });
  }

  function addOut() {
    updateState(s => {
      s.outs = ((s.outs || 0) + 1) % 4;
      return s;
    });
  }

  function clearBS() {
    updateState(s => { s.balls = 0; s.strikes = 0; return s; });
  }

  function toggleBase(num) {
    updateState(s => {
      if (!s.bases) s.bases = {};
      s.bases[num] = !s.bases[num];
      return s;
    });
  }

  function clearBases() {
    updateState(s => { s.bases = { 1: false, 2: false, 3: false }; return s; });
  }

  function nextBatter() {
    updateState(s => {
      if (!s.isBottom) s.batterAway = ((s.batterAway || 0) + 1) % 9;
      else s.batterHome = ((s.batterHome || 0) + 1) % 9;
      s.balls = 0; s.strikes = 0;
      return s;
    });
  }

  function switchHalfInning() {
    updateState(s => {
      const side = s.isBottom ? 'home' : 'away';
      if (!s.scores) s.scores = { away: {}, home: {} };
      if (!s.scores[side]) s.scores[side] = {};
      if (s.scores[side][s.currentInning] === undefined || s.scores[side][s.currentInning] === "") {
        s.scores[side][s.currentInning] = 0;
      }

      if (!s.isBottom) {
        s.isBottom = true;
      } else {
        s.isBottom = false;
        s.currentInning = (s.currentInning || 1) + 1;
      }
      s.balls = 0; s.strikes = 0; s.outs = 0;
      s.bases = { 1: false, 2: false, 3: false };
      return s;
    });
  }

  function resetEntireGame() {
    const isConfirmed = confirm("⚠️ 確定要重設整場比賽資料嗎？所有得分與紀錄將被清空！");
    if (!isConfirmed) return;

    const freshState = {
      currentInning: 1,
      isBottom: false,
      balls: 0,
      strikes: 0,
      outs: 0,
      batterAway: 0,
      batterHome: 0,
      bases: { 1: false, 2: false, 3: false },
      scores: {
        away: { 1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: "" },
        home: { 1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: "" }
      },
      stats: {
        away: { h: 0, e: 0 },
        home: { h: 0, e: 0 }
      },
      playerStats: {
        away: { 0: {h:0, ab:0}, 1: {h:0, ab:0}, 2: {h:0, ab:0}, 3: {h:0, ab:0}, 4: {h:0, ab:0}, 5: {h:0, ab:0}, 6: {h:0, ab:0}, 7: {h:0, ab:0}, 8: {h:0, ab:0} },
        home: { 0: {h:0, ab:0}, 1: {h:0, ab:0}, 2: {h:0, ab:0}, 3: {h:0, ab:0}, 4: {h:0, ab:0}, 5: {h:0, ab:0}, 6: {h:0, ab:0}, 7: {h:0, ab:0}, 8: {h:0, ab:0} }
      }
    };

    localState = freshState;
    renderUI(localState);

    if (stateRef) {
      stateRef.set(freshState);
    }
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'b') { e.preventDefault(); addBall(); }
    if (key === 's') { e.preventDefault(); addStrike(); }
    if (key === 'o') { e.preventDefault(); addOut(); }
    if (key === 'c') { e.preventDefault(); clearBS(); }
    if (key === '1') { e.preventDefault(); toggleBase(1); }
    if (key === '2') { e.preventDefault(); toggleBase(2); }
    if (key === '3') { e.preventDefault(); toggleBase(3); }
    if (key === 'x') { e.preventDefault(); clearBases(); }
    if (key === 'n') { e.preventDefault(); nextBatter(); }
    if (key === 'enter') { e.preventDefault(); switchHalfInning(); }
  });
</script>

</body>
</html>
