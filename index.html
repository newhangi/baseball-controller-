<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>計分板手機遙控器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1120; color: #fff; padding: 15px; }
    h2 { font-size: 18px; margin-bottom: 12px; text-align: center; color: #94a3b8; }
    .section-title { font-size: 13px; color: #64748b; margin: 12px 0 6px 0; font-weight: bold; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    
    button {
      padding: 16px 8px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 8px;
      border: none;
      color: #fff;
      touch-action: manipulation;
      cursor: pointer;
    }
    button:active { filter: brightness(0.8); transform: scale(0.98); }

    .btn-ball { background: #166534; border: 1px solid #22c55e; }
    .btn-strike { background: #854d0e; border: 1px solid #eab308; }
    .btn-out { background: #991b1b; border: 1px solid #ef4444; }
    .btn-blue { background: #2563eb; }
    .btn-slate { background: #334155; }
    .btn-run-add { background: #ea580c; border: 1px solid #f97316; }
    .btn-run-sub { background: #475569; border: 1px solid #64748b; }
    
    /* 打席快捷鍵樣式 */
    .btn-hit { background: #047857; border: 1px solid #10b981; }
    .btn-bb { background: #b45309; border: 1px solid #f59e0b; }
    .btn-error { background: #7c2d12; border: 1px solid #ea580c; }
    .btn-out-atbat { background: #b91c1c; border: 1px solid #f87171; }

    .btn-reset {
      background: #334155;
      color: #f87171;
      width: 100%;
      font-size: 15px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #ef4444;
      font-weight: bold;
    }

    /* 折疊抽屜樣式 */
    .btn-accordion {
      background: #1e293b;
      color: #38bdf8;
      width: 100%;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-weight: bold;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lineup-drawer {
      display: none;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .lineup-table-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #374151;
    }
    .player-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    .player-row span {
      width: 22px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: bold;
      text-align: center;
    }
    .input-name {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .input-pos {
      width: 55px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }
    .btn-save-lineup {
      width: 100%;
      background: #059669;
      color: #fff;
      font-size: 15px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>

  <!-- 引入 Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h2>⚾ OBS 棒球直播控制器</h2>

  <!-- 房間切換輸入列 -->
  <div style="background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
    <span style="font-size: 13px; color: #94a3b8; white-space: nowrap;">目前房間:</span>
    <input id="room-input" type="text" style="background: #0f172a; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 6px; flex: 1; font-size: 14px;" placeholder="例如: default">
    <button onclick="changeRoom()" style="padding: 6px 12px; font-size: 14px; background: #2563eb; border-radius: 6px; border: none; font-weight: normal;">切換</button>
  </div>

  <div class="section-title">好壞球與出局</div>
  <div class="grid-2">
    <button class="btn-ball" onclick="addBall()">壞球 (B+1)</button>
    <button class="btn-strike" onclick="addStrike()">好球 (S+1)</button>
    <button class="btn-out" onclick="addOut()">出局 (O+1)</button>
    <button class="btn-slate" onclick="clearBS()">清空好壞球</button>
  </div>

  <div class="section-title">壘包控制</div>
  <div class="grid-3">
    <button class="btn-slate" id="m-base1" onclick="toggleBase(1)">一壘</button>
    <button class="btn-slate" id="m-base2" onclick="toggleBase(2)">二壘</button>
    <button class="btn-slate" id="m-base3" onclick="toggleBase(3)">三壘</button>
  </div>
  <button class="btn-slate" style="width: 100%; margin-bottom: 10px;" onclick="clearBases()">清空所有壘包</button>

  <div class="section-title">打席結算（自動連動 H / E / 成績）</div>
  <div class="grid-4">
    <button class="btn-hit" onclick="recordHit()">🟢 安打 (H)</button>
    <button class="btn-out-atbat" onclick="recordAtBatOut()">🔴 出局 (Out)</button>
    <button class="btn-bb" onclick="recordBB()">🟡 保送 (BB)</button>
    <button class="btn-error" onclick="recordError()">⚠️ 對方失誤 (E)</button>
  </div>

  <div class="section-title">即時得分與比賽推進</div>
  <div class="grid-2">
    <button class="btn-run-add" onclick="addRun(1)">💥 得分 (+1)</button>
    <button class="btn-run-sub" onclick="addRun(-1)">↩️ 得分 (-1)</button>
    <button class="btn-blue" onclick="prevBatter()">上一棒</button>
    <button class="btn-blue" onclick="nextBatter()">下一棒</button>
  </div>
  <button class="btn-slate" style="width: 100%; margin-bottom: 10px; background: #1e3a8a; border: 1px solid #3b82f6;" onclick="switchHalfInning()">
    🔄 換半局 (切換攻守 / 局數+1)
  </button>

  <!-- 全新比賽重設專區 -->
  <div style="margin-top: 25px; padding-top: 15px; border-top: 1px dashed #475569;">
    <button class="btn-reset" onclick="resetEntireGame()">
      ⚠️ 全新比賽 (清空所有紀錄)
    </button>
  </div>

  <!-- ⚙️ 折疊式先發名單抽屜 -->
  <button class="btn-accordion" onclick="toggleLineupDrawer()">
    <span>⚙️ 先發打線名單設定</span>
    <span id="accordion-arrow">▼ 點擊展開</span>
  </button>

  <div class="lineup-drawer" id="lineup-drawer">
    <div class="lineup-table-title" style="color: #ef4444;">🔴 客隊打線（先攻）</div>
    <div id="away-inputs"></div>

    <div class="lineup-table-title" style="color: #facc15; margin-top: 15px;">🟡 主隊打線（後攻）</div>
    <div id="home-inputs"></div>

    <button class="btn-save-lineup" onclick="saveLineups()">💾 儲存並同步至 OBS</button>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const currentRoom = urlParams.get('room') || 'default';
  document.getElementById('room-input').value = currentRoom;

  const firebaseConfig = {
    apiKey: "AIzaSyBJqOQodUEdLtqiQYPVgsXLnTN1dU-XpUM",
    databaseURL: "https://baseball-board-live-default-rtdb.firebaseio.com",
    projectId: "baseball-board-live"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  const stateRef = db.ref('games/' + currentRoom + '/gameState');
  const lineupRef = db.ref('games/' + currentRoom + '/lineups');

  const defaultAway = [
    { name: "James", pos: "2B" }, { name: "Bryan", pos: "CF" }, { name: "Justin", pos: "SS" },
    { name: "第四棒", pos: "3B" }, { name: "第五棒", pos: "1B" }, { name: "第六棒", pos: "LF" },
    { name: "第七棒", pos: "DH" }, { name: "第八棒", pos: "C" }, { name: "第九棒", pos: "RF" }
  ];
  const defaultHome = [
    { name: "第一棒", pos: "3B" }, { name: "第二棒", pos: "2B" }, { name: "第三棒", pos: "RF" },
    { name: "第四棒", pos: "DH" }, { name: "第五棒", pos: "CF" }, { name: "第六棒", pos: "LF" },
    { name: "第七棒", pos: "SS" }, { name: "第八棒", pos: "C" }, { name: "第九棒", pos: "1B" }
  ];

  function renderInputRows(containerId, list, prefix) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    list.forEach((p, i) => {
      container.innerHTML += `
        <div class="player-row">
          <span>${i + 1}</span>
          <input type="text" class="input-name" id="${prefix}-name-${i}" value="${p.name || ''}" placeholder="姓名">
          <input type="text" class="input-pos" id="${prefix}-pos-${i}" value="${p.pos || ''}" placeholder="守位">
        </div>
      `;
    });
  }
  renderInputRows("away-inputs", defaultAway, "away");
  renderInputRows("home-inputs", defaultHome, "home");

  lineupRef.on('value', (snap) => {
    const data = snap.val();
    if (data) {
      if (data.away) renderInputRows("away-inputs", data.away, "away");
      if (data.home) renderInputRows("home-inputs", data.home, "home");
    }
  });

  function toggleLineupDrawer() {
    const drawer = document.getElementById('lineup-drawer');
    const arrow = document.getElementById('accordion-arrow');
    const isHidden = drawer.style.display === 'none' || drawer.style.display === '';
    drawer.style.display = isHidden ? 'block' : 'none';
    arrow.innerText = isHidden ? '▲ 點擊收合' : '▼ 點擊展開';
  }

  function saveLineups() {
    const away = [];
    const home = [];
    for (let i = 0; i < 9; i++) {
      away.push({
        name: document.getElementById(`away-name-${i}`).value.trim() || `客隊${i+1}棒`,
        pos: document.getElementById(`away-pos-${i}`).value.trim() || ""
      });
      home.push({
        name: document.getElementById(`home-name-${i}`).value.trim() || `主隊${i+1}棒`,
        pos: document.getElementById(`home-pos-${i}`).value.trim() || ""
      });
    }

    lineupRef.set({ away, home }).then(() => {
      alert("✅ 先發名單已儲存並同步至 OBS！");
      toggleLineupDrawer();
    }).catch(err => {
      alert("❌ 儲存失敗：" + err.message);
    });
  }

  function updateState(modifierFn) {
    stateRef.transaction((state) => {
      if (!state) {
        state = {
          currentInning: 1, isBottom: false,
          balls: 0, strikes: 0, outs: 0,
          batterAway: 0, batterHome: 0,
          bases: { 1: false, 2: false, 3: false },
          scores: { away: {}, home: {} },
          stats: { away: { h: 0, e: 0 }, home: { h: 0, e: 0 } },
          playerStats: { away: {}, home: {} }
        };
      }
      return modifierFn(state);
    });
  }

  function ensureStatsStructure(s) {
    if (!s.scores) s.scores = { away: {}, home: {} };
    if (!s.scores.away) s.scores.away = {};
    if (!s.scores.home) s.scores.home = {};
    if (!s.stats) s.stats = { away: { h: 0, e: 0 }, home: { h: 0, e: 0 } };
    if (!s.stats.away) s.stats.away = { h: 0, e: 0 };
    if (!s.stats.home) s.stats.home = { h: 0, e: 0 };
    if (!s.playerStats) s.playerStats = { away: {}, home: {} };
    if (!s.playerStats.away) s.playerStats.away = {};
    if (!s.playerStats.home) s.playerStats.home = {};
    if (!s.bases) s.bases = { 1: false, 2: false, 3: false };
  }

  // === 即時得分累加 / 倒扣 ===
  function addRun(delta) {
    updateState(s => {
      ensureStatsStructure(s);
      const side = s.isBottom ? 'home' : 'away';
      const curScore = parseInt(s.scores[side][s.currentInning], 10) || 0;
      const nextScore = Math.max(0, curScore + delta);
      s.scores[side][s.currentInning] = nextScore;
      return s;
    });
  }

  // === 純切換半局 ===
  function switchHalfInning() {
    updateState(s => {
      ensureStatsStructure(s);
      const side = s.isBottom ? 'home' : 'away';
      // 若該半局沒得分，確保該局數記錄為 0
      if (s.scores[side][s.currentInning] === undefined || s.scores[side][s.currentInning] === "") {
        s.scores[side][s.currentInning] = 0;
      }

      if (!s.isBottom) {
        s.isBottom = true;
      } else {
        s.isBottom = false;
        s.currentInning = (s.currentInning || 1) + 1;
      }
      s.balls = 0; s.strikes = 0; s.outs = 0;
      s.bases = { 1: false, 2: false, 3: false };
      return s;
    });
  }

  // === 打席結算快捷鍵 ===
  function recordHit() {
    updateState(s => {
      ensureStatsStructure(s);
      const offTeam = s.isBottom ? 'home' : 'away';
      const curIdx = s.isBottom ? (s.batterHome || 0) : (s.batterAway || 0);

      s.stats[offTeam].h = (s.stats[offTeam].h || 0) + 1;

      if (!s.playerStats[offTeam][curIdx]) s.playerStats[offTeam][curIdx] = { h: 0, ab: 0 };
      s.playerStats[offTeam][curIdx].h += 1;
      s.playerStats[offTeam][curIdx].ab += 1;

      s.balls = 0; s.strikes = 0;
      s.bases[1] = true;
      if (!s.isBottom) s.batterAway = (curIdx + 1) % 9;
      else s.batterHome = (curIdx + 1) % 9;
      return s;
    });
  }

  function recordAtBatOut() {
    updateState(s => {
      ensureStatsStructure(s);
      const offTeam = s.isBottom ? 'home' : 'away';
      const curIdx = s.isBottom ? (s.batterHome || 0) : (s.batterAway || 0);

      if (!s.playerStats[offTeam][curIdx]) s.playerStats[offTeam][curIdx] = { h: 0, ab: 0 };
      s.playerStats[offTeam][curIdx].ab += 1;

      s.outs = ((s.outs || 0) + 1) % 4;
      s.balls = 0; s.strikes = 0;
      if (!s.isBottom) s.batterAway = (curIdx + 1) % 9;
      else s.batterHome = (curIdx + 1) % 9;
      return s;
    });
  }

  function recordBB() {
    updateState(s => {
      ensureStatsStructure(s);
      const curIdx = s.isBottom ? (s.batterHome || 0) : (s.batterAway || 0);

      s.balls = 0; s.strikes = 0;
      s.bases[1] = true;
      if (!s.isBottom) s.batterAway = (curIdx + 1) % 9;
      else s.batterHome = (curIdx + 1) % 9;
      return s;
    });
  }

  function recordError() {
    updateState(s => {
      ensureStatsStructure(s);
      const offTeam = s.isBottom ? 'home' : 'away';
      const defTeam = s.isBottom ? 'away' : 'home';
      const curIdx = s.isBottom ? (s.batterHome || 0) : (s.batterAway || 0);

      s.stats[defTeam].e = (s.stats[defTeam].e || 0) + 1;

      if (!s.playerStats[offTeam][curIdx]) s.playerStats[offTeam][curIdx] = { h: 0, ab: 0 };
      s.playerStats[offTeam][curIdx].ab += 1;

      s.balls = 0; s.strikes = 0;
      s.bases[1] = true;
      if (!s.isBottom) s.batterAway = (curIdx + 1) % 9;
      else s.batterHome = (curIdx + 1) % 9;
      return s;
    });
  }

  // === 基本控制 ===
  function addBall() {
    updateState(s => {
      s.balls = (s.balls || 0) + 1;
      if (s.balls >= 4) {
        s.balls = 0; s.strikes = 0;
        if (!s.bases) s.bases = {};
        s.bases[1] = true;
      }
      return s;
    });
  }

  function addStrike() {
    updateState(s => {
      s.strikes = (s.strikes || 0) + 1;
      if (s.strikes >= 3) {
        s.balls = 0; s.strikes = 0;
        s.outs = (s.outs || 0) + 1;
      }
      return s;
    });
  }

  function addOut() {
    updateState(s => {
      s.outs = ((s.outs || 0) + 1) % 4;
      return s;
    });
  }

  function clearBS() {
    updateState(s => { s.balls = 0; s.strikes = 0; return s; });
  }

  function toggleBase(num) {
    updateState(s => {
      if (!s.bases) s.bases = {};
      s.bases[num] = !s.bases[num];
      return s;
    });
  }

  function clearBases() {
    updateState(s => { s.bases = { 1: false, 2: false, 3: false }; return s; });
  }

  function nextBatter() {
    updateState(s => {
      if (!s.isBottom) s.batterAway = ((s.batterAway || 0) + 1) % 9;
      else s.batterHome = ((s.batterHome || 0) + 1) % 9;
      s.balls = 0; s.strikes = 0;
      return s;
    });
  }

  function prevBatter() {
    updateState(s => {
      if (!s.isBottom) s.batterAway = ((s.batterAway || 0) + 8) % 9;
      else s.batterHome = ((s.batterHome || 0) + 8) % 9;
      return s;
    });
  }

  function resetEntireGame() {
    const isConfirmed = confirm("⚠️ 確定要重設整場比賽資料嗎？所有得分、安打、失誤與紀錄將被清空！");
    if (!isConfirmed) return;

    const freshState = {
      currentInning: 1,
      isBottom: false,
      balls: 0,
      strikes: 0,
      outs: 0,
      batterAway: 0,
      batterHome: 0,
      bases: { 1: false, 2: false, 3: false },
      scores: {
        away: { 1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: "" },
        home: { 1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: "" }
      },
      stats: {
        away: { h: 0, e: 0 },
        home: { h: 0, e: 0 }
      },
      playerStats: {
        away: { 0: {h:0, ab:0}, 1: {h:0, ab:0}, 2: {h:0, ab:0}, 3: {h:0, ab:0}, 4: {h:0, ab:0}, 5: {h:0, ab:0}, 6: {h:0, ab:0}, 7: {h:0, ab:0}, 8: {h:0, ab:0} },
        home: { 0: {h:0, ab:0}, 1: {h:0, ab:0}, 2: {h:0, ab:0}, 3: {h:0, ab:0}, 4: {h:0, ab:0}, 5: {h:0, ab:0}, 6: {h:0, ab:0}, 7: {h:0, ab:0}, 8: {h:0, ab:0} }
      }
    };

    if (stateRef) {
      stateRef.set(freshState).then(() => {
        alert("✅ 比賽資料已全部清空，回歸第 1 局初！");
      }).catch((err) => {
        alert("❌ 重設失敗：" + err.message);
      });
    }
  }

  function changeRoom() {
    const newRoom = document.getElementById('room-input').value.trim();
    if (newRoom) {
      window.location.href = window.location.pathname + '?room=' + encodeURIComponent(newRoom);
    }
  }
</script>
</body>
</html>
